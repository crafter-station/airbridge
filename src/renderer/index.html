<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Production policy: no remote anything, no eval. Every byte the window shows is bundled,
      and all network access happens in the main process, so the renderer needs none.

      electron.vite.config.ts relaxes this for `electron-vite dev`, where Vite's HMR client
      needs inline scripts and a websocket back to the dev server.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: airbridge:; media-src airbridge:; frame-src airbridge:; font-src 'self'; connect-src 'self' airbridge:; form-action 'none'; base-uri 'none'"
    />
    <title>airbridge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
