appId: dev.airbridge.app
productName: airbridge
afterPack: scripts/adhoc-sign.cjs
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: .
# Unsigned for v1 by design — see PLAN.md, Q18. macOS needs a right-click > Open on first
# launch and Windows shows a SmartScreen warning until this is revisited.
mac:
  category: public.app-category.utilities
  target: dmg
  # No certificate; scripts/adhoc-sign.cjs re-signs ad-hoc under our bundle id instead.
  identity: null
  # macOS 15+ blocks connections to LAN addresses until the user allows Local Network access,
  # and only asks when these are declared. Without them every call to a peer failed silently
  # with "not answering" while the same build launched from a terminal worked.
  extendInfo:
    NSLocalNetworkUsageDescription: airbridge connects to your other computers on this network to share folders with them.
    NSBonjourServices:
      - _airbridge._tcp
win:
  # A portable zip beside the installer: the build is unsigned, so SmartScreen objects to the
  # installer and unzipping somewhere is the easier way to try it.
  target:
    - nsis
    - zip
nsis:
  # Dashes, not the default spaces: GitHub rewrites spaces in asset names, and the updater
  # then cannot find the file latest.yml names.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
# Where the updater looks (src/main/updater.ts). Also makes `electron-builder --publish`
# upload latest.yml next to the installer, which is what an installed copy reads.
publish:
  provider: github
  owner: crafter-station
  repo: airbridge
