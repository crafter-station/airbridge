appId: dev.airbridge.app
productName: airbridge
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: .
# Unsigned for v1 by design — see PLAN.md, Q18. macOS needs a right-click > Open on first
# launch and Windows shows a SmartScreen warning until this is revisited.
mac:
  category: public.app-category.utilities
  target: dmg
  identity: null
win:
  # A portable zip beside the installer: the build is unsigned, so SmartScreen objects to the
  # installer and unzipping somewhere is the easier way to try it.
  target:
    - nsis
    - zip
nsis:
  # Dashes, not the default spaces: GitHub rewrites spaces in asset names, and the updater
  # then cannot find the file latest.yml names.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
# Where the updater looks (src/main/updater.ts). Also makes `electron-builder --publish`
# upload latest.yml next to the installer, which is what an installed copy reads.
publish:
  provider: github
  owner: crafter-station
  repo: airbridge
